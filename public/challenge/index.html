<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thử thách 150 hít đất + 50 kéo xà</title>
<style>
  :root { --bg:#000; --card:#111827; --line:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --accent:#00bbfb; --done:#22c55e; --miss:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Be Vietnam Pro",system-ui,sans-serif; padding:16px; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:560px){ .stats { grid-template-columns:repeat(4,1fr); } }
  .stat b { display:block; font-size:1.4rem; color:var(--accent); }
  .stat span { color:var(--muted); font-size:.8rem; }
  .bar { height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:12px; }
  .bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .3s; }
  .today h2 { margin:0 0 8px; font-size:1.1rem; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:#001; font-weight:600; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); padding:8px 12px; font-weight:400; }
  .tasks label { display:flex; align-items:center; gap:10px; padding:10px 0; font-size:1.05rem; }
  input[type=checkbox] { width:22px; height:22px; accent-color:var(--done); }
  .month { margin:16px 0 6px; color:var(--muted); font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .d { aspect-ratio:1; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--text); font-size:.8rem; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .d small { font-size:.6rem; color:var(--muted); }
  .d.full { background:var(--done); border-color:var(--done); color:#001; } .d.full small { color:#001; }
  .d.part { background:#854d0e; border-color:#a16207; }
  .d.miss { border-color:var(--miss); }
  .d.today { outline:2px solid var(--accent); }
  .d.future { opacity:.4; }
  .d:disabled { cursor:default; }
  .hide { visibility:hidden; }
</style>
</head>
<body>
<main>
  <h1>💪 Thử thách mỗi ngày: 150 hít đất + 50 kéo xà</h1>
  <div class="sub">22/10/2026 → 25/01/2027 · <span id="total-days"></span> ngày</div>

  <section class="card today">
    <h2 id="today-title"></h2>
    <div class="tasks">
      <label><input type="checkbox" id="pu"> 150 hít đất</label>
      <label><input type="checkbox" id="pl"> 50 kéo xà</label>
    </div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><b id="s-streak">0</b><span>Chuỗi ngày liên tiếp</span></div>
      <div class="stat"><b id="s-full">0</b><span>Ngày hoàn thành</span></div>
      <div class="stat"><b id="s-pu">0</b><span>Hít đất / <span id="t-pu"></span></span></div>
      <div class="stat"><b id="s-pl">0</b><span>Kéo xà / <span id="t-pl"></span></span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <section class="card">
    <div id="cal"></div>
    <p class="sub" style="margin:12px 0 0">Bấm vào một ngày để bù/sửa (xanh = đủ, vàng = một phần, đỏ = bỏ lỡ).</p>
    <p style="margin:12px 0 0"><button class="ghost" id="reset">Xóa dữ liệu</button></p>
  </section>
</main>

<script>
const START = new Date(2026, 9, 22), END = new Date(2027, 0, 25);
const PU = 150, PL = 50, KEY = "workout-challenge-2026";
const MONTHS = ["Tháng 1","Tháng 2","Tháng 3","Tháng 4","Tháng 5","Tháng 6","Tháng 7","Tháng 8","Tháng 9","Tháng 10","Tháng 11","Tháng 12"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const days = []; for (let d = START; d <= END; d = addDays(d,1)) days.push(d);
const todayD = new Date(); const today = iso(new Date(todayD.getFullYear(), todayD.getMonth(), todayD.getDate()));

let data = {};
try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
const get = k => data[k] || { pu:false, pl:false };
const state = k => { const e = get(k); return e.pu && e.pl ? "full" : (e.pu || e.pl) ? "part" : "none"; };

let selected = days.some(d => iso(d) === today) ? today : iso(todayD < START ? START : END);

function render() {
  document.getElementById("total-days").textContent = days.length;
  document.getElementById("t-pu").textContent = (days.length*PU).toLocaleString("vi-VN");
  document.getElementById("t-pl").textContent = (days.length*PL).toLocaleString("vi-VN");

  const sel = new Date(selected + "T00:00:00");
  const idx = days.findIndex(d => iso(d) === selected);
  document.getElementById("today-title").textContent =
    (selected === today ? "Hôm nay · " : "") + `Ngày ${idx+1}/${days.length} · ${sel.toLocaleDateString("vi-VN")}`;
  document.getElementById("pu").checked = get(selected).pu;
  document.getElementById("pl").checked = get(selected).pl;

  let full = 0, pu = 0, pl = 0;
  for (const d of days) { const e = get(iso(d)); if (e.pu) pu += PU; if (e.pl) pl += PL; if (e.pu && e.pl) full++; }
  let streak = 0, i = days.findIndex(d => iso(d) === today);
  if (i < 0) i = todayD > END ? days.length-1 : -1;
  if (i >= 0) { if (state(iso(days[i])) !== "full") i--; for (; i >= 0 && state(iso(days[i])) === "full"; i--) streak++; }
  document.getElementById("s-streak").textContent = streak;
  document.getElementById("s-full").textContent = full;
  document.getElementById("s-pu").textContent = pu.toLocaleString("vi-VN");
  document.getElementById("s-pl").textContent = pl.toLocaleString("vi-VN");
  document.getElementById("bar").style.width = (full/days.length*100) + "%";

  const cal = document.getElementById("cal"); cal.innerHTML = "";
  let grid = null, month = -1;
  for (const d of days) {
    if (d.getMonth() !== month) {
      month = d.getMonth();
      const h = document.createElement("div"); h.className = "month"; h.textContent = `${MONTHS[month]} ${d.getFullYear()}`; cal.appendChild(h);
      grid = document.createElement("div"); grid.className = "grid"; cal.appendChild(grid);
      const lead = (d.getDay()+6) % 7; // tuần bắt đầu từ Thứ Hai
      for (let n = 0; n < lead; n++) { const s = document.createElement("div"); s.className = "d hide"; grid.appendChild(s); }
    }
    const k = iso(d), st = state(k);
    const b = document.createElement("button");
    b.className = "d " + (st === "full" ? "full" : st === "part" ? "part" : k < today ? "miss" : k > today ? "future" : "") + (k === today ? " today" : "");
    b.innerHTML = `${d.getDate()}<small>${st === "full" ? "✓" : ""}</small>`;
    if (k > today) b.disabled = true;
    b.onclick = () => { selected = k; render(); };
    grid.appendChild(b);
  }
}

for (const id of ["pu","pl"]) document.getElementById(id).onchange = e => {
  data[selected] = { ...get(selected), [id]: e.target.checked }; save(); render();
};
document.getElementById("reset").onclick = () => { if (confirm("Xóa toàn bộ tiến độ?")) { data = {}; save(); render(); } };
render();
</script>
</body>
</html>
